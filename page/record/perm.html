<!DOCTYPE html>
<meta charset="utf-8">
<title>D2 page: the permutation lab, to film</title>
<style>
  /* From the site's papers/d2/index.html: what the live figure needs */
  :root { --rule: #e7e4dc; --accent: #dc3400; }
  * { box-sizing: border-box; }

  /* the permutation lab, live (js/perm.js): the talk's 960×540 canvas scaled to the column,
     played by a ghost hand until you click to take over */
  .perm-live {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: white;
  }
  .perm-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .perm-ghost {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 2;
  }
  /* What to do, as a red tag on hover (below): "click to take over" while the ghost plays, "your turn /
     drag anything" once it's yours. Both hang over the lower right corner, outside .perm-live (which clips),
     where they hide nothing. */
  .perm-wrap { position: relative; }
  .perm-live:not(.ghosting) ~ .tag-ghost, .perm-live.ghosting ~ .tag-yours { display: none; }
  .perm-wrap > .live-tag {
    left: auto;
    right: -0.8rem;
    bottom: -0.95rem;
    font-size: 0.85rem;
    line-height: 1.25;
    padding: 0.2rem 0.7rem 0.25rem;
    transform-origin: 100% 100%;
    transform: translate(0, 6px) rotate(-1.8deg) scale(0.85);
  }
  .perm-wrap:hover > .live-tag { opacity: 1; transform: rotate(-1.8deg) scale(1); }
  .perm-wrap:active > .live-tag { opacity: 0; }

  /* The live figures' red tag (js/perm.js, js/fig1.js, cards.js), cut like the Best Paper one,
     popping up on hover to say what to do */
  .live-tag {
    position: absolute;
    left: 50%;
    bottom: 0.8rem;
    z-index: 3;
    isolation: isolate;
    padding: 0.2rem 0.85rem 0.25rem;
    font-family: "Cutive Mono", "Courier New", monospace;
    font-size: 0.95rem;
    color: white;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 8px) rotate(-1.2deg) scale(0.85);
    transition: opacity 0.15s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4);
  }
  .live-tag::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--accent);
    transform: skewX(-6deg);
    clip-path: polygon(7px 0, calc(100% - 3px) 0, 100% 5px, 100% calc(100% - 8px),
        calc(100% - 5px) 100%, 3px 100%, 0 calc(100% - 4px), 0 6px);
  }
  :hover > .live-tag { opacity: 1; transform: translate(-50%, 0) rotate(-1.2deg) scale(1); }
  :active > .live-tag { opacity: 0; }

  /* For the clip: no tags (they're for a reader's mouse), and the canvas at
     its own size, unframed. The page draws the frame around the <video> that
     shows the clip (.since video: the same 1px rule and 8px corners as
     .perm-live), so the clip is just what's inside it. */
  .live-tag { display: none !important; }
  html, body { margin: 0; background: white; }
  #root { position: absolute; left: 0; top: 0; width: 960px; height: 540px; }
  .perm-live { border: 0; border-radius: 0; }
</style>
<div id="root"></div>
<script src="out/perm.js"></script>
